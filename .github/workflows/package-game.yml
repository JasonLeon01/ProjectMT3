name: Package Game

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: package-game
  cancel-in-progress: false
  queue: max

jobs:
  check:
    name: Check package inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      project_sha: ${{ steps.project.outputs.project_sha }}
      previous_state_key: ${{ steps.project.outputs.previous_state_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find last successful package
        id: project
        uses: actions/github-script@v8
        with:
          script: |
            const ci = require('./.github/scripts/package-windows.cjs');
            await ci.checkProject({ github, context, core });

  package:
    # Used by the history lookup; keep this name stable.
    name: Package Windows
    needs: check
    outputs:
      tools_key: ${{ steps.ludork.outputs.tools_key }}
      build_key: ${{ steps.build.outputs.save_key }}
      state_key: ${{ steps.build.outputs.state_key }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CMAKE_GENERATOR: Ninja
      PROJECT_SHA: ${{ needs.check.outputs.project_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.project_sha }}
          persist-credentials: false

      - name: Restore last successful state
        if: needs.check.outputs.previous_state_key != ''
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/projectmt3-state/
          key: ${{ needs.check.outputs.previous_state_key }}

      - name: Read cached tool identity
        id: state
        uses: actions/github-script@v8
        with:
          script: |
            require('./.github/scripts/package-windows.cjs').restoreState({ core });

      - name: Restore Ludork tools
        id: tools_cache
        if: steps.state.outputs.tools_key != ''
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ludork/
          key: ${{ steps.state.outputs.tools_key }}

      - name: Compare cached Ludork with main HEAD
        id: ludork
        uses: actions/github-script@v8
        env:
          TOOLS_CACHE_HIT: ${{ steps.tools_cache.outputs.cache-hit }}
        with:
          github-token: ${{ secrets.LUDORK_ACTIONS_TOKEN || github.token }}
          script: |
            const ci = require('./.github/scripts/package-windows.cjs');
            await ci.selectLudork({ github, core });

      - name: Download selected Ludork Windows package
        if: steps.ludork.outputs.download == 'true'
        uses: actions/download-artifact@v8
        with:
          repository: JasonLeon01/Ludork
          run-id: ${{ steps.ludork.outputs.ludork_run_id }}
          artifact-ids: ${{ steps.ludork.outputs.ludork_artifact_id }}
          github-token: ${{ secrets.LUDORK_ACTIONS_TOKEN || github.token }}
          path: ${{ runner.temp }}/ludork
          merge-multiple: true

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Check Engine and compiler cache compatibility
        id: build
        uses: actions/github-script@v8
        with:
          script: |
            require('./.github/scripts/package-windows.cjs').selectBuild({ core, context });

      - name: Restore compatible build
        id: build_cache
        if: steps.build.outputs.restore_key != ''
        uses: actions/cache/restore@v5
        with:
          path: |
            build/
            bin/
            Intermediate/
            ${{ runner.temp }}/projectmt3-build-state/
          key: ${{ steps.build.outputs.restore_key }}

      - name: Validate build cache and restore timestamps
        uses: actions/github-script@v8
        env:
          BUILD_CACHE_HIT: ${{ steps.build_cache.outputs.cache-hit }}
        with:
          script: |
            await require('./.github/scripts/package-windows.cjs').prepareBuild({ core });

      - name: Build and validate Windows package
        shell: pwsh
        env:
          LUDORK_SHA: ${{ steps.ludork.outputs.ludork_sha }}
          LUDORK_RUN_ID: ${{ steps.ludork.outputs.ludork_run_id }}
          LUDORK_ARTIFACT_ID: ${{ steps.ludork.outputs.ludork_artifact_id }}
        run: |
          & ./.github/scripts/package-windows.ps1 `
            -ProjectDirectory $env:GITHUB_WORKSPACE `
            -LudorkDirectory (Join-Path $env:RUNNER_TEMP 'ludork') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'projectmt3-package')

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ProjectMT3-windows-x64-${{ needs.check.outputs.project_sha }}
          path: ${{ runner.temp }}/projectmt3-package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          overwrite: true

      # Separate saves: failed builds/uploads must never advance the baseline.
      - name: Save Ludork tools
        if: steps.ludork.outputs.download == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ludork/
          key: ${{ steps.ludork.outputs.tools_key }}

      - name: Snapshot build inputs and outputs
        uses: actions/github-script@v8
        with:
          script: |
            require('./.github/scripts/package-windows.cjs').snapshotBuild({ core });

      - name: Save successful build
        uses: actions/cache/save@v5
        with:
          path: |
            build/
            bin/
            Intermediate/
            ${{ runner.temp }}/projectmt3-build-state/
          key: ${{ steps.build.outputs.save_key }}

      - name: Publish successful state
        uses: actions/github-script@v8
        with:
          script: |
            require('./.github/scripts/package-windows.cjs').publishState();

      - name: Save successful state
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/projectmt3-state/
          key: ${{ steps.build.outputs.state_key }}

  android:
    name: Package AOS ARM64
    needs: check
    runs-on: macos-15
    timeout-minutes: 180
    env:
      PROJECT_SHA: ${{ needs.check.outputs.project_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.project_sha }}
          persist-credentials: false

      - name: Select Ludork macOS toolchain
        id: ludork
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.LUDORK_ACTIONS_TOKEN || github.token }}
          script: |
            const { upstream, requireSha, selectArtifact } = require('./.github/scripts/package-upstream.cjs');
            const { data } = await github.rest.repos.getBranch({ ...upstream, branch: 'main' });
            const head = requireSha(data.commit.sha);
            const selected = await selectArtifact(github, head, 'macos-arm64');
            for (const [key, value] of Object.entries(selected)) core.setOutput(key, value);
            core.setOutput('ludork_checked_sha', head);
            core.info(`Using Ludork macOS DMG ${selected.ludork_sha}; checked main ${head}`);

      - name: Download Ludork macOS DMG
        uses: actions/download-artifact@v8
        with:
          repository: JasonLeon01/Ludork
          run-id: ${{ steps.ludork.outputs.ludork_run_id }}
          artifact-ids: ${{ steps.ludork.outputs.ludork_artifact_id }}
          github-token: ${{ secrets.LUDORK_ACTIONS_TOKEN || github.token }}
          path: ${{ runner.temp }}/ludork-android-artifact
          merge-multiple: true

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          if [[ ! -d '/Applications/Android Studio.app' ]]; then
            brew install --cask android-studio
          fi
          export JAVA_HOME='/Applications/Android Studio.app/Contents/jbr/Contents/Home'
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # sdkmanager's status matters; yes may exit on a closed pipe.
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          cmake --version
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"

      - name: Build and validate signed AOS APK
        shell: bash
        env:
          LUDORK_SHA: ${{ steps.ludork.outputs.ludork_sha }}
          LUDORK_CHECKED_SHA: ${{ steps.ludork.outputs.ludork_checked_sha }}
          LUDORK_RUN_ID: ${{ steps.ludork.outputs.ludork_run_id }}
          LUDORK_ARTIFACT_ID: ${{ steps.ludork.outputs.ludork_artifact_id }}
          AOS_ALIAS: ${{ secrets.AOS_ALIAS }}
          AOS_KEY_PASSWORD: ${{ secrets.AOS_KEY_PASSWORD }}
          AOS_KEY_STORE_PASSWORD: ${{ secrets.AOS_KEY_STORE_PASSWORD }}
          AOS_SIGNING_KEY: ${{ secrets.AOS_SIGNING_KEY }}
        run: |
          bash .github/scripts/package-android.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ludork-android-artifact" \
            "$RUNNER_TEMP/projectmt3-android-package"

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/projectmt3-aos.jks"

      - name: Upload signed AOS APK
        uses: actions/upload-artifact@v7
        with:
          name: ProjectMT3-aos-arm64-v8a-${{ needs.check.outputs.project_sha }}
          path: |
            ${{ runner.temp }}/projectmt3-android-package/*-android-arm64-v8a-signed.apk
            ${{ runner.temp }}/projectmt3-android-package/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  cleanup:
    name: Clean superseded package caches
    needs: [package, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Keep the current successful cache set
        uses: actions/github-script@v8
        env:
          CURRENT_TOOLS_KEY: ${{ needs.package.outputs.tools_key }}
          CURRENT_BUILD_KEY: ${{ needs.package.outputs.build_key }}
          CURRENT_STATE_KEY: ${{ needs.package.outputs.state_key }}
        with:
          script: |
            await require('./.github/scripts/package-windows.cjs').cleanupCaches({ github, context, core }, {
              tools: process.env.CURRENT_TOOLS_KEY,
              build: process.env.CURRENT_BUILD_KEY,
              state: process.env.CURRENT_STATE_KEY,
            });
