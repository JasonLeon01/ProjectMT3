name: Check First Daily Push

on:
  workflow_call:
    outputs:
      should_run:
        description: Whether this caller may build for this push
        value: ${{ jobs.gate.outputs.should_run }}

permissions:
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.daily.outputs.should_run }}
    steps:
      - name: Allow manual runs or the first daily push
        id: daily
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('should_run', 'true');
              return;
            }

            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            // Use creation time, so queue delays and reruns keep the original day.
            const offset = 8 * 60 * 60 * 1000;
            const day = new Date(Date.parse(current.created_at) + offset).toISOString().slice(0, 10);
            const start = new Date(`${day}T00:00:00+08:00`).toISOString();
            // The caller's workflow ID keeps packaging and standalone independent.
            for await (const page of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: current.workflow_id,
              branch: current.head_branch,
              event: 'push',
              created: `${start}..${current.created_at}`,
              per_page: 100,
            })) {
              const earlier = page.data.find(run => run.run_number < current.run_number);
              if (earlier) {
                core.info(`Skip: push run ${earlier.id} already occupies ${day} (Asia/Shanghai).`);
                core.setOutput('should_run', 'false');
                return;
              }
            }
            core.info(`First push on ${day} (Asia/Shanghai).`);
            core.setOutput('should_run', 'true');
